name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 도메인 중립 검사 — 대조군(금지어를 잡는지·오탐이 없는지)
        run: python3 scripts/ci/check_neutral_terms.py --self-test
      - name: 도메인 중립 검사
        run: python3 scripts/ci/check_neutral_terms.py
      - name: 글 조회 판정 절 검사 — 대조군
        run: python3 scripts/ci/check_post_clause.py --self-test
      - name: 글 조회 판정 절 검사
        run: python3 scripts/ci/check_post_clause.py
      - name: 에디터 토큰 생성 파일 비교
        run: python3 scripts/gen_editor_tokens.py --check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mypage
          POSTGRES_PASSWORD: mypage
          POSTGRES_DB: mypage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mypage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mypage:mypage@localhost:5432/mypage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 백엔드 없이 빌드한다 — 빌드 시점에 FastAPI 를 부르는 코드가 생기면 여기서 실패한다
      - run: npm run build

  # 접근성 구조 검사(설계도 §13·§16.3-6) — 전체 스택(PostgreSQL·FastAPI·Next)을 띄우고 실제 브라우저로 axe-core 를 돌린다
  a11y:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mypage
          POSTGRES_PASSWORD: mypage
          POSTGRES_DB: mypage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mypage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 백엔드(pydantic-settings)와 Next 가 같은 이름을 읽는다. CI 전용 값(비밀 아님)
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://mypage:mypage@localhost:5432/mypage
      DEV_VIEWER_HEADER: "true"
      DEV_VIEWER_SECRET: ci-dev-viewer-secret-0123456789
      INTERNAL_API_SECRET: ci-internal-api-secret-0123456789abcdef
      APP_ENV: dev
      DEV_VIEWER_LOGIN: "true"
      BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: 백엔드 — 마이그레이션·개발 시드·기동
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m scripts.seed_dev
          nohup uv run uvicorn app.main:app --port 8000 > ../uvicorn.log 2>&1 &
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프런트 — 빌드·기동
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../next.log 2>&1 &
      - name: 브라우저 설치(Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 기동 확인
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          cat uvicorn.log next.log; exit 1
      - name: axe 대조군(틀린 화면에서 위반을 잡는지)
        working-directory: frontend
        run: node scripts/a11y-check.mts --self-test
      - name: axe 검사(비회원·회원·운영자 주요 화면)
        working-directory: frontend
        run: node scripts/a11y-check.mts --base http://localhost:3000 --admin 1 --member 3
      - name: 실패 시 서버 기록
        if: failure()
        run: tail -n 100 uvicorn.log next.log

  # 배포 구성 검사(설계도 §17) — Mac 에서는 systemd 를 돌릴 수 없어 Ubuntu 에서 문법·참조를 확인한다
  deploy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: nginx 설정 검사(nginx -t)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nginx
          sudo install -m 644 deploy/nginx/mypage-security-headers.conf /etc/nginx/snippets/
          sudo install -m 644 deploy/nginx/mypage.conf /etc/nginx/conf.d/
          sudo nginx -t
      - name: systemd 유닛 검사(systemd-analyze verify)
        run: |
          # 유닛이 가리키는 실행 파일·폴더·환경 파일 자리를 만든다(실제 앱은 설치하지 않는다)
          sudo mkdir -p /srv/mypage/app/backend/.venv/bin /srv/mypage/app/frontend/.next/standalone /srv/mypage/shared /etc/mypage
          for f in uvicorn python; do printf '#!/bin/sh\n' | sudo tee /srv/mypage/app/backend/.venv/bin/$f > /dev/null; sudo chmod +x /srv/mypage/app/backend/.venv/bin/$f; done
          [ -x /usr/bin/node ] || { printf '#!/bin/sh\n' | sudo tee /usr/bin/node > /dev/null; sudo chmod +x /usr/bin/node; }
          sudo cp deploy/env/backend.env.example /etc/mypage/backend.env
          sudo cp deploy/env/frontend.env.example /etc/mypage/frontend.env
          getent passwd mypage || sudo useradd --system --no-create-home mypage
          sudo install -m 644 deploy/systemd/*.service /etc/systemd/system/
          sudo systemd-analyze verify /etc/systemd/system/mypage-*.service

  # nginx 경유 실제 확인(설계도 §17) — 운영 배치(/srv/mypage/shared, FILE_SENDER=nginx, standalone, 저장소의 nginx 설정)로 띄워
  # deploy/smoke.sh 가 바인딩·보안 헤더·/media·internal·업로드 상한·실제 IP·스트리밍·X-Accel-Redirect 를 본다.
  # 로컬 Mac 은 conda-forge nginx 의 kqueue 결함으로 nginx 를 거친 측정을 하지 않는다(§16.1)
  nginx-smoke:
    runs-on: ubuntu-latest
    needs: [deploy-check]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mypage
          POSTGRES_PASSWORD: mypage
          POSTGRES_DB: mypage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mypage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://mypage:mypage@localhost:5432/mypage
      DEV_VIEWER_HEADER: "true"
      DEV_VIEWER_SECRET: ci-dev-viewer-secret-0123456789
      INTERNAL_API_SECRET: ci-internal-api-secret-0123456789abcdef
      MEDIA_ROOT: /srv/mypage/shared/media
      PRIVATE_ROOT: /srv/mypage/shared/private
      FILE_SENDER: nginx
      APP_ENV: dev
      DEV_VIEWER_LOGIN: "true"
      BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 운영 배치의 폴더
        run: sudo mkdir -p /srv/mypage/shared/media /srv/mypage/shared/private && sudo chown -R "$USER" /srv/mypage && chmod 755 /srv /srv/mypage /srv/mypage/shared
      - name: 빌드(deploy/build.sh)
        run: ./deploy/build.sh
      - name: 마이그레이션·개발 시드·기동(유닛과 같은 실행 인자, 측정을 위해 접근 기록만 켬)
        run: |
          cd backend && uv run --no-sync alembic upgrade head && uv run --no-sync python -m scripts.seed_dev
          nohup .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips 127.0.0.1 > ../uvicorn.log 2>&1 &
          cd ../frontend/.next/standalone && NODE_ENV=production HOSTNAME=127.0.0.1 PORT=3000 nohup node server.js > ../../../next.log 2>&1 &
      - name: nginx(저장소의 설정 그대로)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nginx
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo install -m 644 deploy/nginx/mypage-security-headers.conf /etc/nginx/snippets/
          sudo sed 's/server_name example.org;/server_name localhost;/' deploy/nginx/mypage.conf | sudo tee /etc/nginx/conf.d/mypage.conf > /dev/null
          sudo nginx -t && sudo systemctl restart nginx
          for i in $(seq 1 60); do curl -sf http://localhost/api/health && exit 0; sleep 1; done; cat uvicorn.log next.log; exit 1
      - name: 점검(deploy/smoke.sh)
        run: ./deploy/smoke.sh http://localhost /srv/mypage/shared/media uvicorn.log 3
      - name: 실패 시 기록
        if: failure()
        run: tail -n 60 uvicorn.log next.log; sudo tail -n 30 /var/log/nginx/mypage.error.log
