name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 도메인 중립 검사 — 대조군(금지어를 잡는지·오탐이 없는지)
        run: python3 scripts/ci/check_neutral_terms.py --self-test
      - name: 도메인 중립 검사
        run: python3 scripts/ci/check_neutral_terms.py
      - name: 글 조회 판정 절 검사 — 대조군
        run: python3 scripts/ci/check_post_clause.py --self-test
      - name: 글 조회 판정 절 검사
        run: python3 scripts/ci/check_post_clause.py
      - name: 에디터 토큰 생성 파일 비교
        run: python3 scripts/gen_editor_tokens.py --check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mypage
          POSTGRES_PASSWORD: mypage
          POSTGRES_DB: mypage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mypage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mypage:mypage@localhost:5432/mypage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 백엔드 없이 빌드한다 — 빌드 시점에 FastAPI 를 부르는 코드가 생기면 여기서 실패한다
      - run: npm run build
