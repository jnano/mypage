name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  neutral-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 도메인 중립 검사 — 대조군(금지어를 잡는지·오탐이 없는지)
        run: python3 scripts/ci/check_neutral_terms.py --self-test
      - name: 도메인 중립 검사
        run: python3 scripts/ci/check_neutral_terms.py

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mypage
          POSTGRES_PASSWORD: mypage
          POSTGRES_DB: mypage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mypage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mypage:mypage@localhost:5432/mypage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest -q
