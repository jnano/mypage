# mypage — Next 로 넘기는 프록시 설정(설계도 §17). /etc/nginx/snippets/mypage-proxy.conf 로 둔다.
# mypage.conf 의 location 둘(/ 와 = /api/frame)이 함께 쓴다 — 머리 규칙이 한 곳에만 있게.
# 스트리밍은 Next 의 X-Accel-Buffering: no 로 버퍼링을 끈다
proxy_pass http://mypage_next;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# 출처 검사(Route Handler·Server Action)가 이 머리를 먼저 본다 — 바깥 값을 버리고 실제 Host 로
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Real-IP $remote_addr;
# 바깥 요청이 보낸 X-Forwarded-For 는 버리고 실제 연결 IP 로 덮어쓴다(nginx 가 가장자리 — 위조 방지).
# 앞에 CDN·부하 분산기를 두면 set_real_ip_from + real_ip_header 로 그 장비만 믿게 바꾼다
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
