name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  neutral-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도메인 중립 검사
        run: python3 scripts/ci/check_neutral_terms.py
      - name: 도메인 중립 검사 — 음성 대조군(금지어가 있으면 실패해야 한다)
        run: |
          printf '성당\n' > "$RUNNER_TEMP/bad.txt"
          if python3 scripts/ci/check_neutral_terms.py "$RUNNER_TEMP/bad.txt"; then
            echo "금지어를 잡지 못했다" && exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mypage
          POSTGRES_PASSWORD: mypage
          POSTGRES_DB: mypage_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mypage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mypage:mypage@localhost:5432/mypage_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q
