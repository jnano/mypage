# mypage — nginx 사이트 설정(설계도 §17). /etc/nginx/conf.d/mypage.conf 로 둔다.
# TLS 는 certbot 이 이 server 블록에 덧붙인다(README '4. TLS'). server_name 은 실제 도메인으로 바꾼다.
# 앱 프로세스(Next 3000·FastAPI 8000)는 127.0.0.1 에만 묶여 있고, 바깥 요청은 모두 여기를 거친다.

upstream mypage_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org;

    server_tokens off;
    # 업로드 상한 — 게시판 첨부 정책의 가장 큰 값(자료실 견본 50MB)보다 조금 크게. 앱이 다시 게시판별로 자른다
    client_max_body_size 55m;
    include /etc/nginx/snippets/mypage-security-headers.conf;

    access_log /var/log/nginx/mypage.access.log;
    error_log /var/log/nginx/mypage.error.log warn;

    # 공개 저장소 — 공개 글의 사진(og:image 포함)을 nginx 가 직접 내준다(§12.2). 파일 이름이 바뀌면 주소도 바뀐다
    location /media/ {
        alias /srv/mypage/shared/media/;
        include /etc/nginx/snippets/mypage-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # 비공개 저장소 — 권한 판정을 마친 FastAPI 응답의 X-Accel-Redirect 로만 닿는다(바깥에서 직접 못 연다)
    location /_private/private/ {
        internal;
        alias /srv/mypage/shared/private/;
    }
    location /_private/public/ {
        internal;
        alias /srv/mypage/shared/media/;
    }

    # Next — 화면·Route Handler·/api/*(Next 가 FastAPI 로 넘긴다). 스트리밍은 Next 의 X-Accel-Buffering: no 로 버퍼링을 끈다
    location / {
        proxy_pass http://mypage_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
